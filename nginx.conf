# DNS INTERNO DE DOCKER

resolver 127.0.0.11 valid=10s;


# MAPA DE MICRO FRONTENDS

map $uri $mfe_target {

    default                         "http://shell";

    "~^/auth/"                      "http://mfe-auth";

    "~^/erp/dashboard/"             "http://mfe-dashboard";

    "~^/erp/contabilidad/"          "http://mfe-contabilidad";

    "~^/erp/importaciones/"         "http://mfe-importaciones";

    "~^/erp/inventarios/"           "http://mfe-inventarios";

    "~^/erp/system-administrador/"  "http://mfe-system-administrador";

    "~^/payments/"                  "http://mfe-payments";
}

# SERVER

server {

    listen 80;
    server_name _;

    # REMOTE ENTRY

    location = /auth/remoteEntry.js {

        proxy_pass http://mfe-auth/remoteEntry.js;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /erp/dashboard/remoteEntry.js {

        proxy_pass http://mfe-dashboard/remoteEntry.js;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # REMOTE ENTRY - CONTABILIDAD

    location = /erp/contabilidad/remoteEntry.js {

        proxy_pass http://mfe-contabilidad/remoteEntry.js;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # REMOTE ENTRY - IMPORTACIONES

    location = /erp/importaciones/remoteEntry.js {

        proxy_pass http://mfe-importaciones/remoteEntry.js;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # REMOTE ENTRY - INVENTARIOS

    location = /erp/inventarios/remoteEntry.js {

        proxy_pass http://mfe-inventarios/remoteEntry.js;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # REMOTE ENTRY - SYSTEM ADMINISTRADOR

    location = /erp/system-administrador/remoteEntry.js {

        proxy_pass http://mfe-system-administrador/remoteEntry.js;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # REMOTE ENTRY - PAYMENTS

    location = /payments/remoteEntry.js {

        proxy_pass http://mfe-payments/remoteEntry.js;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ASSETS DE LOS MFE (regex por extension)
    location ~* \.(js|css|json|woff|woff2|ttf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {

        # Guarda el upstream ANTES de que el rewrite modifique $uri
        set $upstream $mfe_target;

        # Quita el prefijo de cada app para que coincida con la raíz del contenedor
        rewrite ^/auth/(.+)$                     /$1 break;
        rewrite ^/erp/dashboard/(.+)$            /$1 break;
        rewrite ^/erp/contabilidad/(.+)$         /$1 break;
        rewrite ^/erp/importaciones/(.+)$        /$1 break;
        rewrite ^/erp/inventarios/(.+)$          /$1 break;
        rewrite ^/erp/system-administrador/(.+)$ /$1 break;
        rewrite ^/payments/(.+)$                 /$1 break;

        proxy_pass $upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # llegan al shell.

    location / {

        proxy_pass http://shell/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
    }
}
