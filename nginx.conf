server {
    listen 80;
    server_name _;

    # ============================================
    # SHELL (raíz del dominio)
    # ============================================
    location / {
        proxy_pass http://shell/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # MFE-AUTH (subruta /auth/)
    # ============================================
    location /auth/ {
        proxy_pass http://mfe-auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # MFE-CONTABILIDAD (subruta /erp/contabilidad/)
    # ============================================
    location /erp/contabilidad/ {
        proxy_pass http://mfe-contabilidad/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
