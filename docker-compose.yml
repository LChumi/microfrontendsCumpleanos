version: '3.8'

services:
  # ============================================
  # NGINX INTERNO (reverse proxy)
  # ============================================
  nginx2:
    image: nginx:alpine
    container_name: nginx2
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - shell
      - mfe-auth
      - mfe-contabilidad
    networks:
      - microfrontends

  # ============================================
  # SHELL
  # ============================================
  shell:
    build:
      context: .
      dockerfile: projects/shell/Dockerfile
    container_name: shell
    expose:
      - "80"
    networks:
      - microfrontends

  # ============================================
  # MFE-AUTH
  # ============================================
  mfe-auth:
    build:
      context: .
      dockerfile: projects/mfe-auth/Dockerfile
    container_name: mfe-auth
    expose:
      - "80"
    networks:
      - microfrontends

  # ============================================
  # MFE-CONTABILIDAD
  # ============================================
  mfe-contabilidad:
    build:
      context: .
      dockerfile: projects/mfe-contabilidad/Dockerfile
    container_name: mfe-contabilidad
    expose:
      - "80"
    networks:
      - microfrontends

networks:
  microfrontends:
    driver: bridge
