<section class="mt-8">
  <div class="mb-4 flex items-center justify-between">
    <div>
      <h2 class="m-0 text-lg font-semibold text-slate-700">Últimos accesos</h2>
      <p class="mt-1 text-sm text-slate-500">Tus accesos recientes al sistema</p>
    </div>
  </div>

  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">
    @if (accesos.length) {
      <div class="divide-y divide-slate-100">
        @for (acceso of accesos; track acceso.sessionId) {
          <div class="flex items-center justify-between gap-4 p-4 transition hover:bg-slate-50">
            <div class="flex min-w-0 items-center gap-3">
              <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-50 text-blue-600">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 2m6-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                </svg>
              </div>

              <div class="min-w-0">
                <p class="m-0 truncate text-sm font-semibold text-slate-700">
                  {{ formatFecha(acceso.loginTime) }}
                </p>
                <p class="mt-0.5 truncate text-xs text-slate-500">
                  {{ acceso.ipAddress }}
                </p>
              </div>
            </div>

            <span class="shrink-0 rounded-md bg-slate-50 px-2.5 py-1 text-xs font-medium text-slate-500">
              {{ formatHora(acceso.loginTime) }}
            </span>
          </div>
        }
      </div>
    } @else {
      <div class="flex flex-col items-center justify-center py-12 text-center">
        <svg class="mb-2 h-6 w-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 2m6-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        <p class="m-0 text-sm text-slate-500">No existen accesos registrados</p>
      </div>
    }
  </div>
</section>
