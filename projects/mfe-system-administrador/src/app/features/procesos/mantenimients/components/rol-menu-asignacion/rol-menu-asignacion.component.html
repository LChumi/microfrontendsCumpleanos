<div class="flex justify-between items-center mb-3">
  <h3 class="m-0">Asignación Rol - Menú</h3>
  <p-button label="Nueva Asignación" icon="pi pi-plus" (onClick)="openNew()"></p-button>
</div>

<p-table [value]="relaciones" [paginator]="true" [rows]="10">
  <ng-template pTemplate="header">
    <tr>
      <th>Rol</th>
      <th>Menú</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-rel>
    <tr>
      <td>{{ rel.rolW.nombre }}</td>
      <td>{{ rel.menuW.nombre }}</td>
      <td>
        <p-button icon="pi pi-pencil" [text]="true" size="small" (onClick)="openEdit(rel)"></p-button>
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog header="{{ isEditMode ? 'Editar' : 'Nueva' }} Asignación" [(visible)]="dialogVisible" [modal]="true" [style]="{width: '700px'}" [draggable]="false" [resizable]="false">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5 py-3">
    <div class="flex flex-col gap-2">
      <label class="text-sm font-semibold text-gray-700">Rol</label>
      <p-dropdown [options]="roles" [(ngModel)]="form.rolW" optionLabel="nombre" [filter]="true" filterBy="nombre" appendTo="body" styleClass="w-full" placeholder="Seleccione un rol"></p-dropdown>
    </div>
    <div class="flex flex-col gap-2">
      <label class="text-sm font-semibold text-gray-700">Menú</label>
      <p-dropdown [options]="menus" [(ngModel)]="form.menuW" optionLabel="nombre" [filter]="true" filterBy="nombre" appendTo="body" styleClass="w-full" placeholder="Seleccione un menú"></p-dropdown>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button label="Cancelar" [text]="true" severity="secondary" (onClick)="dialogVisible = false"></p-button>
      <p-button label="Guardar" icon="pi pi-check" (onClick)="save()"></p-button>
    </div>
  </ng-template>
</p-dialog>
