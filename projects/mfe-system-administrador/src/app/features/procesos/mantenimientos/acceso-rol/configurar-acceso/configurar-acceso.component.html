<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <div>
    <label class="mb-1.5 block text-xs font-semibold text-gray-600">Empresa</label>
    <select [(ngModel)]="empresaId" (change)="onEmpresaChange()" class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 shadow-sm outline-none transition-all hover:border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
      <option [ngValue]="null">Seleccione una empresa...</option>
      @for (e of empresas(); track e.id) {
        <option [ngValue]="e.id">{{ e.nombre }}</option>
      }
    </select>
  </div>

  <div>
    <label class="mb-1.5 block text-xs font-semibold text-gray-600">Almacén</label>
    <select [(ngModel)]="almacenId" [disabled]="!empresaId" (change)="onAlmacenChange()" class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 shadow-sm outline-none transition-all hover:border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 disabled:cursor-not-allowed disabled:border-gray-200 disabled:bg-gray-50 disabled:text-gray-400">
      <option [ngValue]="null">Seleccione un almacén...</option>
      @for (a of almacenes(); track a.codigo) {
        <option [ngValue]="a.codigo">{{ a.nombre }}</option>
      }
    </select>
  </div>

  <div>
    <label class="mb-1.5 block text-xs font-semibold text-gray-600">Rol</label>
    <select [(ngModel)]="rolId" class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 shadow-sm outline-none transition-all hover:border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
      <option [ngValue]="null">Seleccione un rol...</option>
      @for (r of roles(); track r.id) {
        <option [ngValue]="r.id">{{ r.nombre }}</option>
      }
    </select>
  </div>
</div>

<div class="mt-5 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
  <button
    type="button"
    [disabled]="!puedeAgregar()"
    (click)="onAgregarClick()"
    class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-blue-700 hover:shadow disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400 disabled:shadow-none focus:outline-none focus:ring-2 focus:ring-blue-500/30 sm:w-auto">
    <svg class="h-4 w-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m-7-7h14"/>
    </svg>
    Agregar acceso
  </button>
</div>
