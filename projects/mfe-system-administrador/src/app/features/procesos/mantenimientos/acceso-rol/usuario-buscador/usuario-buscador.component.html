<div class="w-full space-y-4">
  <div class="relative">
    <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
      <svg class="h-5 w-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
      </svg>
    </span>

    <input
      [(ngModel)]="usrId"
      (input)="buscar()"
      placeholder="Buscar por usuario..."
      class="w-full rounded-lg border border-gray-200 bg-white py-2.5 pl-10 pr-4 text-sm text-gray-700 uppercase shadow-sm outline-none transition-all placeholder:normal-case placeholder:text-gray-400 hover:border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" />
  </div>

  @if (resultados().length) {
    <!-- Desktop -->
    <div class="hidden overflow-x-auto rounded-xl border border-gray-200 bg-white shadow-sm sm:block">
      <table class="w-full min-w-[500px] text-sm">
        <thead class="border-b border-gray-200 bg-gray-50">
        <tr>
          <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide text-gray-500">Usuario</th>
          <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide text-gray-500">Nombre</th>
        </tr>
        </thead>

        <tbody class="divide-y divide-gray-100">
          @for (u of resultados(); track u.codigo) {
            <tr
              class="group cursor-pointer transition-colors duration-150 hover:bg-blue-50/60"
              (click)="seleccionar(u)">
              <td class="px-5 py-3.5">
                <div class="flex items-center gap-3">
                  <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs font-semibold text-blue-600">
                    {{ u.usrId.charAt(0) }}
                  </div>
                  <span class="font-semibold text-gray-700 group-hover:text-blue-700">{{ u.usrId }}</span>
                </div>
              </td>

              <td class="px-5 py-3.5 text-gray-600">{{ u.nombre }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- Mobile -->
    <div class="space-y-2 sm:hidden">
      @for (u of resultados(); track u.codigo) {
        <button
          type="button"
          (click)="seleccionar(u)"
          class="group flex w-full items-center gap-3 rounded-xl border border-gray-200 bg-white p-3 text-left shadow-sm transition-all hover:border-blue-200 hover:bg-blue-50/50 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
          <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs font-semibold text-blue-600 group-hover:bg-blue-100">
            {{ u.usrId.charAt(0) }}
          </div>

          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-gray-700 group-hover:text-blue-700">
              {{ u.usrId }}
            </p>
            <p class="mt-0.5 truncate text-xs text-gray-500">
              {{ u.nombre }}
            </p>
          </div>

          <svg class="h-4 w-4 shrink-0 text-gray-300 group-hover:text-blue-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/>
          </svg>
        </button>
      }
    </div>
  }
</div>
