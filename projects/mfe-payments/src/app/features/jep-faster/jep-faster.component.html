<div class="flex min-h-screen w-full flex-col items-center justify-center bg-cover bg-center px-4" style="background-image: url('/images/background/fondoJep.webp');">
  @if (imageBase64) {
    <div class="mb-5 rounded-xl bg-white/50 p-5 shadow-lg backdrop-blur-sm">
      <img
        [src]="imageBase64"
        alt="Código QR"
        class="h-auto w-[450px] max-w-full rounded-lg object-contain"
        />
    </div>

    <div class="w-full max-w-[600px]">
      <div class="h-2 w-full overflow-hidden rounded-full bg-slate-200">
        <div class="h-full w-1/3 animate-pulse rounded-full bg-blue-600"></div>
      </div>
    </div>
  }
</div>


<!-- Dialog -->
@if (showDialog) {
  <div
    class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog-title"
    (document:keydown.enter)="acceptDialog()"
    (document:keydown.escape)="acceptDialog()"
  >
    <div class="w-full max-w-lg overflow-hidden rounded-2xl bg-white shadow-2xl ring-1 ring-black/5">
      <!-- Header -->
      <div class="flex items-center gap-4 px-6 py-5">
        @if (dialogType === 'success') {
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-green-100 text-green-600">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          </div>
        } @else {
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-600">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        }
        <h2 id="dialog-title" class="text-lg font-semibold text-slate-800">
          {{ dialogTitle }}
        </h2>
      </div>

      <!-- Content -->
      <div class="px-6 pb-6">
        <p class="m-0 text-sm leading-relaxed text-slate-600">
          {{ dialogMessage }}
        </p>
      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-3 bg-slate-50 px-6 py-4">
        <button
          type="button"
          (click)="acceptDialog()"
          class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white
                 shadow-sm transition hover:bg-blue-700 active:bg-blue-800
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          Ok
        </button>
      </div>
    </div>
  </div>
}

<!-- Toast -->
@if (showToast) {
  <div
    class="fixed right-5 top-5 z-[1100] w-full max-w-sm rounded-xl border border-amber-200
           bg-white p-4 shadow-2xl ring-1 ring-black/5"
    role="alert"
  >
    <div class="flex gap-3">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-600">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <div class="min-w-0">
        <p class="m-0 font-semibold text-slate-800">
          {{ toastSummary }}
        </p>
        <p class="mt-1 mb-0 text-sm text-slate-600">
          Cierre la ventana por favor
        </p>
      </div>

      <button
        type="button"
        (click)="showToast = false"
        class="ml-auto flex h-6 w-6 shrink-0 items-center justify-center rounded-full
               text-slate-400 transition hover:bg-slate-100 hover:text-slate-600
               focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-1"
        aria-label="Cerrar"
      >
        ×
      </button>
    </div>
  </div>
}
