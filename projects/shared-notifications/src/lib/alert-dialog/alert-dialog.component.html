@if (visible) {
  <div
    class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog-title"
  >
    <div class="w-full max-w-lg overflow-hidden rounded-2xl bg-white shadow-2xl ring-1 ring-black/5">
      <div class="flex items-center gap-4 px-6 py-5">
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full" [ngClass]="iconClasses">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath" />
          </svg>
        </div>
        <h2 id="dialog-title" class="text-lg font-semibold text-slate-800">{{ title }}</h2>
      </div>

      <div class="px-6 pb-6">
        <p class="m-0 text-sm leading-relaxed text-slate-600">{{ message }}</p>
      </div>

      <div class="flex justify-end gap-3 bg-slate-50 px-6 py-4">
        <button
          type="button"
          (click)="onAccept()"
          class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white border-0
                 shadow-sm transition hover:bg-blue-700 active:bg-blue-800
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          {{ okLabel }}
        </button>
      </div>
    </div>
  </div>
}
