@if (visible) {
  <div
    [ngClass]="borderClasses"
    class="fixed right-5 top-5 z-[1100] w-full max-w-sm rounded-xl border bg-white p-4 shadow-2xl ring-1 ring-black/5"
    role="alert">
    <div class="flex gap-3">
      <div [ngClass]="iconClasses" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full">
        @switch (type) {
          @case ('success') {
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
          }
          @case ('warning') {
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          }
          @case ('error') {
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          }
          @case ('info') {
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-4m0-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          }
        }
      </div>

      <div class="min-w-0">
        <p class="m-0 font-semibold text-slate-800">{{ summary }}</p>
        @if (detail) {
          <p class="mb-0 mt-1 text-sm text-slate-600">{{ detail }}</p>
        }
      </div>

      <button
        type="button"
        (click)="close()"
        aria-label="Cerrar"
        [ngClass]="focusClasses"
        class="ml-auto flex h-8 w-8 items-center justify-center rounded-full border-0 bg-transparent text-slate-400 transition-colors duration-200 hover:bg-transparent hover:text-slate-600 focus:outline-none focus:ring-2">
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>
}
