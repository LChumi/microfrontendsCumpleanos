<div class="flex items-center justify-center gap-1">
  <span class="text-xs text-slate-400">{{ solicitada() }} /</span>
  @if (editando()) {
    <input #inp type="number" min="1" [value]="valor()"
           (keyup.enter)="guardar(inp.value)"
           (keyup.escape)="editando.set(false)"
           class="w-14 rounded-md border border-slate-300 px-1.5 py-0.5 text-center text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
    <button type="button" (click)="guardar(inp.value)" title="Confirmar"
            class="appearance-none border-0 bg-transparent p-1 text-green-600 hover:bg-green-50 rounded-md">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </button>
  } @else {
    <span class="font-semibold text-slate-800">{{ valor() }}</span>
    <button type="button" (click)="editando.set(true)" title="Editar cantidad"
            class="appearance-none border-0 bg-transparent p-1 text-slate-400 hover:bg-blue-50 hover:text-blue-600 rounded-md">
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>
    </button>
  }
</div>
