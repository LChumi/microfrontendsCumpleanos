<div class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/80 p-4"
     role="dialog" aria-modal="true" aria-label="Escáner de código de barras"
     (click)="cerrar.emit()">

  <div class="w-full max-w-md overflow-hidden rounded-xl bg-black shadow-2xl"
       (click)="$event.stopPropagation()">
    <video #video playsinline muted autoplay
           class="block max-h-[65dvh] w-full object-contain"></video>
  </div>

  <p class="mt-3 px-2 text-center text-sm text-white/80">
    Muestra el código de barras completo y espera a que se vea nítido
  </p>

  @if (procesandoFoto()) {
    <div class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60">
      <div class="rounded-xl bg-white px-5 py-4 text-sm font-medium text-slate-700 shadow-xl">
        Leyendo código…
      </div>
    </div>
  }

  <div class="mt-4 flex gap-2" (click)="$event.stopPropagation()">
    <button type="button" (click)="abrirSelectorFoto()"
            class="appearance-none border-0 h-11 rounded-lg bg-blue-500 px-5 text-sm font-semibold text-white hover:bg-blue-600">
      Tomar foto
    </button>
    <button type="button" (click)="cerrar.emit()"
            class="appearance-none border-0 h-11 rounded-lg bg-white px-6 text-sm font-semibold text-slate-700 hover:bg-slate-100">
      Cancelar
    </button>
  </div>
</div>
