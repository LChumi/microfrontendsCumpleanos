<div class="relative inline-block text-left w-64">

  <!-- Botón trigger -->
  <button
    type="button"
    (click)="toggleDropdown()"
    class="flex w-full items-center justify-between rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1"
  >
    <span class="truncate">
      {{ bodegaActual()?.nombre ?? 'Seleccionar bodega' }}
    </span>
    <svg
      class="ml-2 h-4 w-4 text-gray-400 transition-transform duration-150"
      [class.rotate-180]="abierto()"
      fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Panel del dropdown -->
  @if (abierto()) {
    <div
      class="absolute z-10 mt-1 w-full origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none max-h-60 overflow-auto"
    >
      <ul class="py-1 text-sm text-gray-700">
        @for (bodega of bodegas(); track bodega.id) {
          <li
            (click)="seleccionarBodega(bodega)"
            class="cursor-pointer px-4 py-2 hover:bg-blue-50 hover:text-blue-700"
            [class.bg-blue-100]="bodega.id === bodegaActual()?.id"
            [class.font-semibold]="bodega.id === bodegaActual()?.id"
          >
            {{ bodega.nombre }}
          </li>
        } @empty {
          <li class="px-4 py-2 text-gray-400">No hay bodegas disponibles</li>
        }
      </ul>
    </div>
  }
</div>
