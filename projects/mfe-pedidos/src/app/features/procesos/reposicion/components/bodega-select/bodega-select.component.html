<div class="relative inline-block w-72 text-left">
  <button type="button" (click)="toggleDropdown()" class="border-0 flex w-full items-center justify-between rounded-lg border-slate-200 bg-white px-3.5 py-2.5 text-sm font-medium text-slate-700 shadow-sm transition-all duration-150 hover:border-slate-300 hover:bg-slate-50 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
    <div class="flex min-w-0 items-center gap-2.5">
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-blue-50 text-blue-600">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M9 10h.01M15 10h.01M9 13h.01M15 13h.01"/></svg>
      </div>
      <div class="min-w-0 text-left">
        <span class="block text-[11px] font-medium uppercase tracking-wide text-slate-400">Bodega</span>
        <span class="block truncate text-sm font-semibold text-slate-700">{{ bodegaActual()?.nombre ?? 'Seleccionar bodega' }}</span>
      </div>
    </div>
    <svg class="ml-3 h-4 w-4 shrink-0 text-slate-400 transition-transform duration-200" [class.rotate-180]="abierto()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
  </button>

  @if (abierto()) {
    <div class="absolute left-0 z-50 mt-2 w-full overflow-hidden rounded-lg border border-slate-200 bg-white shadow-xl shadow-slate-200/50 ring-1 ring-black/5">
      <div class="border-b border-slate-100 px-3.5 py-2.5">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-400">Seleccionar bodega</span>
      </div>
      <ul class="max-h-60 overflow-auto py-1.5">
        @for (bodega of bodegas(); track bodega.id) {
          <li (click)="seleccionarBodega(bodega)" class="mx-1.5 flex cursor-pointer items-center justify-between rounded-md px-3 py-2.5 text-sm text-slate-600 transition-colors duration-100 hover:bg-slate-50 hover:text-slate-900" [class.bg-blue-50]="bodega.id === bodegaActual()?.id" [class.text-blue-700]="bodega.id === bodegaActual()?.id" [class.font-semibold]="bodega.id === bodegaActual()?.id">
            <span class="truncate">{{ bodega.nombre }}</span>
            @if (bodega.id === bodegaActual()?.id) {
              <svg class="ml-2 h-4 w-4 shrink-0 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            }
          </li>
        } @empty {
          <li class="px-4 py-4 text-center text-sm text-slate-400">No hay bodegas disponibles</li>
        }
      </ul>
    </div>
  }
</div>
