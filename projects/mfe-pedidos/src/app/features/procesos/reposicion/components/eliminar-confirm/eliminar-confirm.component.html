@if (eliminando()) {
  <span class="p-1.5">
        <svg class="h-4 w-4 animate-spin text-slate-400" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z"></path>
        </svg>
      </span>
} @else {
  <div class="relative">
    <button type="button" (click)="confirmando.set(true)"
            class="appearance-none border-0 shadow-none inline-flex items-center gap-1.5 rounded-lg bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-100">
      <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
      Eliminar
    </button>
    @if (confirmando()) {
      <div class="absolute right-0 top-full z-30 mt-2 w-56 rounded-lg border border-slate-200 bg-white p-3 shadow-lg">
        <p class="mb-2 text-sm font-medium text-slate-700">¿Eliminar este producto?</p>
        <p class="mb-3 text-xs text-slate-500">Esta acción no se puede deshacer.</p>
        <div class="flex justify-end gap-2">
          <button type="button" (click)="confirmando.set(false)"
                  class="border-0 rounded-md px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-100">No</button>
          <button type="button" (click)="aceptar()"
                  class="border-0 rounded-md bg-red-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-red-700">Sí, eliminar</button>
        </div>
      </div>
    }
  </div>
}
