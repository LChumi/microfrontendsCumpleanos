<div class="min-h-screen w-full flex items-center justify-center bg-gradient-to-b from-[#f0f9ff] to-white px-4 py-12">
  <h1 class="sr-only">Selección de Empresa | Assist Web</h1>

  <div class="w-full max-w-lg">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-3 mb-4">
      <img
        ngSrc="/images/logo_assist.webp"
        alt="Assist"
        width="130"
        height="91"
        class="h-14 w-auto object-contain"
      />

      <div class="leading-none">
        <span class="font-[Poppins] font-extrabold text-[#4d4d4f] tracking-wide text-2xl">ASSIST</span><br>
        <span class="text-[10px] font-medium tracking-[0.22em] text-gray-400">SOFTWARE</span>
      </div>

    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-xl shadow-gray-200/50 px-8 py-7 sm:px-12 max-w-lg mx-auto">
      <div class="flex flex-col items-center text-center">

        <!-- Icono -->
        <div class="flex items-center justify-center w-14 h-14 rounded-full bg-[#00acec] mb-1">
          <i class="pi pi-building text-white text-2xl"></i>
        </div>

        <!-- Título -->
        <h2 class="font-[Poppins] text-xl font-bold text-[#4d4d4f] mb-1">
          Empresas
        </h2>

        <p class="text-sm font-semibold text-[#00acec] mb-5">
          Seleccione la empresa
        </p>

        <!-- Empresas -->
        <div class="w-full max-w-md flex flex-col gap-2.5">
          @for (empresa of listasEmpresa; track $index) {
            <button
              type="button"
              (click)="empresaSelected(empresa)"
              class="w-full min-h-14 px-5 rounded-lg
                     appearance-none border-0 bg-transparent p-0 shadow-none
                     text-[#00acec] font-semibold text-sm
                     hover:bg-blue-500 hover:text-white
                     transition-colors duration-200
                     focus:outline-none focus:ring-4 focus:ring-[#00acec]/15"
            >
              {{ empresa.nombre }}
            </button>
          }
        </div>

      </div>
    </div>

  </div>
</div>
