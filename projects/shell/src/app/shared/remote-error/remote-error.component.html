<h1 class="sr-only">Pagina no Encontrada | Assist Web</h1>
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg"
     class="min-h-screen min-w-screen fixed left-0" style="bottom:-10rem" preserveAspectRatio="none">
  <rect x="0" y="0" width="960" height="540" fill="var(--surface-ground)"></rect>
  <path
    d="M0 331L26.7 321C53.3 311 106.7 291 160 291C213.3 291 266.7 311 320 329.5C373.3 348 426.7 365 480 373.2C533.3 381.3 586.7 380.7 640 373.8C693.3 367 746.7 354 800 341.2C853.3 328.3 906.7 315.7 933.3 309.3L960 303L960 541L933.3 541C906.7 541 853.3 541 800 541C746.7 541 693.3 541 640 541C586.7 541 533.3 541 480 541C426.7 541 373.3 541 320 541C266.7 541 213.3 541 160 541C106.7 541 53.3 541 26.7 541L0 541Z"
    fill="var(--blue-500)" stroke-linecap="round" stroke-linejoin="miter"></path>
</svg>
<div class="px-5 min-h-screen flex justify-center items-center">
  <div class="z-[1] text-center">
    <div class="text-gray-900 font-bold text-8xl mb-4">Oops!</div>
    <h2>Servicio no disponible</h2>
    <p class="leading-normal mt-0 mb-5 text-gray-700 text-xl font-medium">El módulo que intentas acceder no pudo cargarse.</p>
    @if (errorMessage) {
      <p class="error-detail">{{ errorMessage }}</p>
    }
    <div class="flex gap-2 justify-center">
      <button pButton label="Reintentar" icon="pi pi-refresh" (click)="retry()"></button>
      <button pButton label="Volver al inicio" icon="pi pi-home" class="p-button-secondary" (click)="goHome()"></button>
    </div>
  </div>
</div>
