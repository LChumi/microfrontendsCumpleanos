@if (visible) {
  <div
    class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="idle-dialog-title"
  >
    <div
      class="w-full max-w-sm rounded-2xl bg-white shadow-2xl ring-1 ring-slate-200 p-6 animate-in fade-in zoom-in-95 duration-200"
    >
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-amber-100">
          <svg class="h-5 w-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.007M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        </div>
        <h2 id="idle-dialog-title" class="text-base font-semibold text-slate-900">
          Tu sesión está por expirar
        </h2>
      </div>

      <p class="mt-3 text-sm text-slate-600">
        Por seguridad, cerraremos tu sesión automáticamente en unos minutos por inactividad.
        ¿Deseas continuar?
      </p>

      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          (click)="logoutNow()"
          class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors"
        >
          Cerrar sesión
        </button>
        <button
          type="button"
          (click)="continueSession()"
          class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 transition-colors"
        >
          Sigo aquí
        </button>
      </div>
    </div>
  </div>
}
