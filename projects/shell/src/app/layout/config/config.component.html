<button class="layout-config-button p-link" aria-label="Configuracion" type="button" (click)="onConfigButtonClick()"><i class="pi pi-cog"></i></button>

<p-sidebar [(visible)]="visible" position="right" [transitionOptions]="'.3s cubic-bezier(0, 0, 0.2, 1)'" styleClass="layout-config-sidebar w-72">
  <h5>Temas</h5>
  <div class="flex flex-wrap gap-y-3">
    <div class="w-1/4" *ngFor="let theme of componentThemes">
      <button type="button" class="cursor-pointer p-link w-8 h-8 rounded-full shrink-0 flex items-center justify-center" (click)="changeTheme(theme.name)" [ngStyle]="{'background-color': theme.color}"><i *ngIf="theme.name == this.layoutService.config().theme" class="pi pi-check text-white"></i></button>
    </div>
  </div>

  <h5>Tamaño</h5>
  <div class="flex items-center">
    <button icon="pi pi-minus" type="button" pButton (click)="decrementScale()" class="p-button-text p-button-rounded w-8 h-8 mr-2" [disabled]="scale === scales[0]"></button>
    <div class="flex gap-2 items-center">
      <i class="pi pi-circle-fill text-gray-300" *ngFor="let s of scales" [ngClass]="{'text-primary-500': s === scale}"></i>
    </div>
    <button icon="pi pi-plus" type="button" pButton (click)="incrementScale()" class="p-button-text p-button-rounded w-8 h-8 ml-2" [disabled]="scale === scales[scales.length - 1]"></button>
  </div>

  <ng-container *ngIf="!minimal">
    <h5>Tipo Menu</h5>
    <div class="flex flex-wrap gap-y-3">
      <div class="flex items-center gap-2 w-1/2"><p-radioButton name="menuMode" value="static" [(ngModel)]="menuMode" inputId="mode1"></p-radioButton><label for="mode1">Estatico</label></div>
      <div class="flex items-center gap-2 w-1/2"><p-radioButton name="menuMode" value="overlay" [(ngModel)]="menuMode" inputId="mode2"></p-radioButton><label for="mode2">Cubierto</label></div>
      <div class="flex items-center gap-2 w-1/2"><p-radioButton name="menuMode" value="slim" [(ngModel)]="menuMode" inputId="mode3"></p-radioButton><label for="mode3">Iconos</label></div>
      <div class="flex items-center gap-2 w-1/2"><p-radioButton name="menuMode" value="slim-plus" [(ngModel)]="menuMode" inputId="mode4"></p-radioButton><label for="mode3">Iconos +</label></div>
      <div class="flex items-center gap-2 w-1/2"><p-radioButton name="menuMode" value="reveal" [(ngModel)]="menuMode" inputId="mode6"></p-radioButton><label for="mode5">Revelar</label></div>
      <div class="flex items-center gap-2 w-1/2"><p-radioButton name="menuMode" value="drawer" [(ngModel)]="menuMode" inputId="mode7"></p-radioButton><label for="mode6">Cajon</label></div>
      <div class="flex items-center gap-2 w-1/2"><p-radioButton name="menuMode" value="horizontal" [(ngModel)]="menuMode" inputId="mode5"></p-radioButton><label for="mode4">Horizontal</label></div>
    </div>

    <h5>Tema del menú</h5>
    <div class="flex items-center gap-2"><p-radioButton name="menuTheme" value="colorScheme" [(ngModel)]="menuTheme" inputId="menutheme-colorscheme"></p-radioButton><label for="menutheme-colorscheme">Combinación de colores</label></div>
    <div class="flex items-center gap-2"><p-radioButton name="menuTheme" value="primaryColor" [(ngModel)]="menuTheme" inputId="menutheme-primarycolor"></p-radioButton><label for="menutheme-primarycolor">Color primario</label></div>
    <div class="flex items-center gap-2"><p-radioButton name="menuTheme" value="transparent" [(ngModel)]="menuTheme" inputId="menutheme-transparent"></p-radioButton><label for="menutheme-transparent">Transparente</label></div>
  </ng-container>

  <h5>Esquema de colores</h5>
  <div class="flex items-center gap-2"><p-radioButton name="colorScheme" value="light" [(ngModel)]="colorScheme" inputId="mode-light"></p-radioButton><label for="mode-light">Claro</label></div>
  <div class="flex items-center gap-2"><p-radioButton name="colorScheme" value="dim" [(ngModel)]="colorScheme" inputId="mode-dim"></p-radioButton><label for="mode-dim">Tenue</label></div>
  <div class="flex items-center gap-2"><p-radioButton name="colorScheme" value="dark" [(ngModel)]="colorScheme" inputId="mode-dark"></p-radioButton><label for="mode-dark">Oscuro</label></div>

  <ng-container *ngIf="!minimal">
    <h5>Estilo de entrada</h5>
    <div class="flex">
      <div class="flex items-center gap-2 flex-1"><p-radioButton name="inputStyle" value="outlined" [(ngModel)]="inputStyle" inputId="outlined_input"></p-radioButton><label for="outlined_input">Delineado</label></div>
      <div class="flex items-center gap-2 flex-1"><p-radioButton name="inputStyle" value="filled" [(ngModel)]="inputStyle" inputId="filled_input"></p-radioButton><label for="filled_input">Relleno</label></div>
    </div>

    <h5>Efecto dominó</h5>
    <p-inputSwitch [(ngModel)]="ripple"></p-inputSwitch>
  </ng-container>
</p-sidebar>
